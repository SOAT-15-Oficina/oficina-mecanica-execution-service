apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        tags.datadoghq.com/service: execution-service
      annotations:
        ad.datadoghq.com/api.logs: '[{"source":"go","service":"execution-service"}]'
    spec:
      serviceAccountName: execution-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: api
          image: execution-service
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: execution-config
