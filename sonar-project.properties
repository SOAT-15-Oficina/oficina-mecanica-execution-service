sonar.projectKey=oficina-mecanica-execution-service
sonar.projectName=Oficina Mecanica - Execution Service
sonar.projectVersion=0.1.0

sonar.sourceEncoding=UTF-8
sonar.sources=cmd,docs,internal
sonar.tests=internal
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,.git/**,.scannerwork/**,.github/**,infra/**,k8s/**,local/**
sonar.coverage.exclusions=cmd/**,docs/**,**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
