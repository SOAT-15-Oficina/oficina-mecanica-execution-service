services:
  api:
    build: .
    env_file: .env
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      localstack:
        condition: service_healthy

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs,sns,dynamodb
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    ports:
      - "4567:4566"
    volumes:
      - ./local/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal dynamodb describe-table --table-name execution-tickets >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
